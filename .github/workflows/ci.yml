name: macOS tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          xcodegen generate
      - name: Run isolated macOS tests
        run: |
          xcodebuild -project Margined.xcodeproj -scheme Margined -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/Margined-tests" \
            CODE_SIGN_IDENTITY=- test > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -80 "$RUNNER_TEMP/tests.log"; exit 1; }

      - name: Check each interface language in a fresh process
        run: |
          xcodebuild -project Margined.xcodeproj -scheme Margined -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/Margined-tests" \
            CODE_SIGN_IDENTITY=- build-for-testing > "$RUNNER_TEMP/locale-build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/locale-build.log"; exit 1; }
          python3 script/test-localizations.py "$RUNNER_TEMP/Margined-tests"

      - name: Preserve test failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-failure-details
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/Margined-tests/Logs/Test
          retention-days: 7
