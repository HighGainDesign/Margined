name: iOS draft scroll callback comparison
on:
  workflow_dispatch:
    inputs:
      trace_mode:
        description: Plain source or callback-only scroll and dismissal measurements
        type: choice
        options: [plain, callback]
        default: plain
permissions:
  contents: read
concurrency:
  group: ios-draft-scroll-callback-${{ github.ref }}-${{ inputs.trace_mode }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          xcodegen generate
      - name: Run immediate appearance predecessors and original draft case in fifty fresh processes
        env:
          MARGINED_DRAFT_CALLBACK_MODE: ${{ inputs.trace_mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/draft-scroll-callback"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/draft-scroll-callback/devices.json"
          device_id=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/draft-scroll-callback/devices.json")); print(next(x["udid"] for g in d["devices"].values() for x in g if "iPhone" in x["name"]))')
          callback_flags=DEBUG
          if [[ "$MARGINED_DRAFT_CALLBACK_MODE" == callback ]]; then
            callback_flags='DEBUG MARGINED_DRAFT_SCROLL_CALLBACK_DIAGNOSTIC'
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/draft-scroll-callback/source.txt"
          xcodebuild -version >> "$RUNNER_TEMP/draft-scroll-callback/source.txt"
          printf '%s\n' "device=$device_id mode=$MARGINED_DRAFT_CALLBACK_MODE flags=$callback_flags" >> "$RUNNER_TEMP/draft-scroll-callback/source.txt"
          shasum -a 256 iOS/Views/Discussions/MobileDiscussionDraftEditor.swift iOSTests/MobileAppearanceTests.swift iOSTests/MobileDiscussionDraftScrollingTests.swift >> "$RUNNER_TEMP/draft-scroll-callback/source.txt"
          result=0
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/Margined-draft-scroll-callback" \
            -resultBundlePath "$RUNNER_TEMP/draft-scroll-callback/behavior.xcresult" \
            CODE_SIGNING_ALLOWED=NO "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$callback_flags" \
            -only-testing:MarginediOSTests/MobileAppearanceTests \
            -only-testing:MarginediOSTests/MobileDiscussionDraftScrollingTests \
            -parallel-testing-enabled NO -test-iterations 50 -test-repetition-relaunch-enabled YES \
            test > "$RUNNER_TEMP/draft-scroll-callback/behavior.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/draft-scroll-callback/test-exit.txt"
          tail -30 "$RUNNER_TEMP/draft-scroll-callback/behavior.log"
          exit "$result"
      - name: Preserve all attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-draft-scroll-callback-${{ inputs.trace_mode }}
          path: ${{ runner.temp }}/draft-scroll-callback
          retention-days: 7
