name: iOS draft layout and diagram phase diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-draft-layout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare unchanged native test actions
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          node script/tests/test_reader_resize.cjs App/Resources/reader-document.js
          node --test script/tests/test_discussion_layout.cjs
          xcodegen generate
          mkdir -p "$RUNNER_TEMP/draft-layout-diagnostic"
          git rev-parse HEAD > "$RUNNER_TEMP/draft-layout-diagnostic/source.txt"
          xcodebuild -version >> "$RUNNER_TEMP/draft-layout-diagnostic/source.txt"
          shasum -a 256 App/Resources/reader-document.js iOS/Views/Discussions/MobileDiscussionDraftEditor.swift iOSTests/MobileDiscussionDraftScrollingTests.swift Shared/DiagramRenderer.swift >> "$RUNNER_TEMP/draft-layout-diagnostic/source.txt"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/draft-layout-diagnostic/devices.json"
      - name: Run full suite in two fresh processes with bounded failure traces
        run: |
          device_id=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/draft-layout-diagnostic/devices.json")); print(next(x["udid"] for g in d["devices"].values() for x in g if "iPhone" in x["name"]))')
          printf '%s\n' "$device_id" > "$RUNNER_TEMP/draft-layout-diagnostic/selected-device.txt"
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/Margined-draft-layout-diagnostic" \
            -resultBundlePath "$RUNNER_TEMP/draft-layout-diagnostic/full.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG MARGINED_DRAFT_LAYOUT_DIAGNOSTIC MARGINED_DIAGRAM_DIAGNOSTIC' \
            -parallel-testing-enabled NO -test-iterations 2 -test-repetition-relaunch-enabled YES \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            test > "$RUNNER_TEMP/draft-layout-diagnostic/full.log" 2>&1 || { tail -80 "$RUNNER_TEMP/draft-layout-diagnostic/full.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/draft-layout-diagnostic/full.log"
      - name: Preserve all diagnostic attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-draft-layout-details
          path: ${{ runner.temp }}/draft-layout-diagnostic
          retention-days: 7
