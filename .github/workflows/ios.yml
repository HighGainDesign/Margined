name: iOS draft reveal ownership comparison

on:
  workflow_dispatch:
    inputs:
      trace_mode:
        description: Plain subclass or owned-reveal-only trace
        type: choice
        options: [plain, reveal]
        default: plain

permissions:
  contents: read

concurrency:
  group: ios-draft-reveal-${{ github.ref }}-${{ inputs.trace_mode }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out matched diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          node script/tests/test_reader_resize.cjs App/Resources/reader-document.js
          node --test script/tests/test_discussion_layout.cjs
          xcodegen generate
      - name: Repeat the unchanged pre-draft suite prefix in twenty fresh processes
        env:
          MARGINED_DRAFT_REVEAL_MODE: ${{ inputs.trace_mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/draft-reveal-diagnostic"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/draft-reveal-diagnostic/devices.json"
          device_id=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/draft-reveal-diagnostic/devices.json")); print(next(x["udid"] for g in d["devices"].values() for x in g if "iPhone" in x["name"]))')
          draft_flags=DEBUG
          if [[ "$MARGINED_DRAFT_REVEAL_MODE" == reveal ]]; then
            draft_flags='DEBUG MARGINED_DRAFT_REVEAL_DIAGNOSTIC'
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/draft-reveal-diagnostic/source.txt"
          xcodebuild -version >> "$RUNNER_TEMP/draft-reveal-diagnostic/source.txt"
          printf '%s\n' "device=$device_id mode=$MARGINED_DRAFT_REVEAL_MODE flags=$draft_flags" >> "$RUNNER_TEMP/draft-reveal-diagnostic/source.txt"
          shasum -a 256 iOS/Views/Discussions/MobileDiscussionDraftEditor.swift iOSTests/MobileDiscussionDraftScrollingTests.swift >> "$RUNNER_TEMP/draft-reveal-diagnostic/source.txt"
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/Margined-draft-reveal-diagnostic" \
            -resultBundlePath "$RUNNER_TEMP/draft-reveal-diagnostic/prefix.xcresult" \
            CODE_SIGNING_ALLOWED=NO "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$draft_flags" \
            -only-testing:MarginediOSTests/ConversationPlaybackTests \
            -only-testing:MarginediOSTests/DiscussionAnchorTests \
            -only-testing:MarginediOSTests/DiscussionCodecTests \
            -only-testing:MarginediOSTests/DiscussionHistoryLifecycleTests \
            -only-testing:MarginediOSTests/DiscussionMarginTests \
            -only-testing:MarginediOSTests/DiscussionReconciliationTests \
            -only-testing:MarginediOSTests/DiscussionRenderingTests \
            -only-testing:MarginediOSTests/DiscussionSessionTests \
            -only-testing:MarginediOSTests/DiscussionWebTests \
            -only-testing:MarginediOSTests/MarkdownSourceEditsTests \
            -only-testing:MarginediOSTests/MobileAppearanceTests \
            -only-testing:MarginediOSTests/MobileDiscussionDraftScrollingTests \
            -parallel-testing-enabled NO -test-iterations 20 -test-repetition-relaunch-enabled YES \
            test > "$RUNNER_TEMP/draft-reveal-diagnostic/prefix.log" 2>&1 || { tail -80 "$RUNNER_TEMP/draft-reveal-diagnostic/prefix.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/draft-reveal-diagnostic/prefix.log"
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-draft-reveal-${{ inputs.trace_mode }}
          path: ${{ runner.temp }}/draft-reveal-diagnostic
          retention-days: 7
