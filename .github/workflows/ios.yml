name: iOS resize diagnosis

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - README.md
      - ROADMAP.md
      - PRIVACY.md
      - .github/workflows/ci.yml
      - .github/workflows/tests.yml
      - .github/workflows/release.yml
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - README.md
      - ROADMAP.md
      - PRIVACY.md
      - .github/workflows/ci.yml
      - .github/workflows/tests.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          node script/tests/test_reader_resize.cjs App/Resources/reader-document.js
          node --test script/tests/test_discussion_layout.cjs
          xcodegen generate
      - name: Trace interaction tests in two fresh processes
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/Margined-ios" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:MarginediOSTests/MobileDiscussionInteractionTests \
            -test-iterations 2 -test-repetition-relaunch-enabled YES \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 90 \
            test > "$RUNNER_TEMP/ios-tests.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ios-tests.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/ios-tests.log"
      - name: Preserve validation details including all test attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-validation-details
          path: |
            ${{ runner.temp }}/ios-tests.log
            ${{ runner.temp }}/ios-device.log
            ${{ runner.temp }}/Margined-ios/Logs/Test
          retention-days: 7
