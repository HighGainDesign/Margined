name: iOS full-suite draft layout diagnostic

on:
  workflow_dispatch:
    inputs:
      trace_mode:
        description: Plain production subclass or value-only layout trace
        type: choice
        options: [plain, light]
        default: light

permissions:
  contents: read

concurrency:
  group: ios-draft-full-light-${{ github.ref }}-${{ inputs.trace_mode }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out matched diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          node script/tests/test_reader_resize.cjs App/Resources/reader-document.js
          node --test script/tests/test_discussion_layout.cjs
          xcodegen generate
      - name: Run the full unchanged suite in three fresh processes
        env:
          MARGINED_DRAFT_TRACE_MODE: ${{ inputs.trace_mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/draft-light-diagnostic"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/draft-light-diagnostic/devices.json"
          device_id=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/draft-light-diagnostic/devices.json")); print(next(x["udid"] for g in d["devices"].values() for x in g if "iPhone" in x["name"]))')
          draft_flags=DEBUG
          if [[ "$MARGINED_DRAFT_TRACE_MODE" == light ]]; then
            draft_flags='DEBUG MARGINED_DRAFT_LAYOUT_DIAGNOSTIC'
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/draft-light-diagnostic/source.txt"
          xcodebuild -version >> "$RUNNER_TEMP/draft-light-diagnostic/source.txt"
          printf '%s\n' "device=$device_id mode=$MARGINED_DRAFT_TRACE_MODE flags=$draft_flags" >> "$RUNNER_TEMP/draft-light-diagnostic/source.txt"
          shasum -a 256 iOS/Views/Discussions/MobileDiscussionDraftEditor.swift iOSTests/MobileDiscussionDraftScrollingTests.swift >> "$RUNNER_TEMP/draft-light-diagnostic/source.txt"
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/Margined-draft-light-diagnostic" \
            -resultBundlePath "$RUNNER_TEMP/draft-light-diagnostic/draft.xcresult" \
            CODE_SIGNING_ALLOWED=NO "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$draft_flags" \
            -parallel-testing-enabled NO -test-iterations 3 -test-repetition-relaunch-enabled YES \
            test > "$RUNNER_TEMP/draft-light-diagnostic/draft.log" 2>&1 || { tail -80 "$RUNNER_TEMP/draft-light-diagnostic/draft.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/draft-light-diagnostic/draft.log"
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-draft-full-light-${{ inputs.trace_mode }}
          path: ${{ runner.temp }}/draft-light-diagnostic
          retention-days: 7
