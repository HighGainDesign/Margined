name: iOS resize geometry timing experiment

on:
  workflow_dispatch:
    inputs:
      geometry_mode:
        description: Existing JavaScript restoration or temporary native geometry gate
        type: choice
        options: [javascript, native-gate]
        default: javascript

permissions:
  contents: read

concurrency:
  group: ios-geometry-${{ github.ref }}-${{ inputs.geometry_mode }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out experimental source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare unchanged native tests and protocol checks
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          node script/tests/test_reader_resize.cjs App/Resources/reader-document.js
          node script/tests/test_reader_geometry_experiment.cjs App/Resources/reader-document.js
          node --test script/tests/test_discussion_layout.cjs
          xcodegen generate
      - name: Run full native suite in two fresh processes
        env:
          MARGINED_GEOMETRY_MODE: ${{ inputs.geometry_mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/geometry-experiment"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/geometry-experiment/devices.json"
          device_id=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/geometry-experiment/devices.json")); print(next(x["udid"] for g in d["devices"].values() for x in g if "iPhone" in x["name"]))')
          experiment_flags=DEBUG
          if [[ "$MARGINED_GEOMETRY_MODE" == native-gate ]]; then
            experiment_flags='DEBUG MARGINED_RESIZE_GEOMETRY_EXPERIMENT'
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/geometry-experiment/source.txt"
          xcodebuild -version >> "$RUNNER_TEMP/geometry-experiment/source.txt"
          printf '%s\n' "device=$device_id mode=$MARGINED_GEOMETRY_MODE flags=$experiment_flags" >> "$RUNNER_TEMP/geometry-experiment/source.txt"
          shasum -a 256 App/Resources/reader-document.js iOS/Services/MobileResizeGeometryExperiment.swift iOS/Views/MobileWebView.swift >> "$RUNNER_TEMP/geometry-experiment/source.txt"
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/Margined-geometry-experiment" \
            -resultBundlePath "$RUNNER_TEMP/geometry-experiment/full.xcresult" \
            CODE_SIGNING_ALLOWED=NO "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$experiment_flags" \
            -parallel-testing-enabled NO -test-iterations 2 -test-repetition-relaunch-enabled YES \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            test > "$RUNNER_TEMP/geometry-experiment/full.log" 2>&1 || { tail -80 "$RUNNER_TEMP/geometry-experiment/full.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/geometry-experiment/full.log"
      - name: Preserve all experimental attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-resize-geometry-${{ inputs.geometry_mode }}
          path: ${{ runner.temp }}/geometry-experiment
          retention-days: 7
