name: iOS validation

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - README.md
      - ROADMAP.md
      - PRIVACY.md
      - .github/workflows/ci.yml
      - .github/workflows/tests.yml
      - .github/workflows/release.yml
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - README.md
      - ROADMAP.md
      - PRIVACY.md
      - .github/workflows/ci.yml
      - .github/workflows/tests.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          node script/tests/test_reader_resize.cjs App/Resources/reader-document.js
          node script/tests/test_native_reading_position.cjs iOS/Resources/native-reading-position.js
          node script/tests/test_native_scroll_lock.cjs iOS/Resources/native-resize-scroll-lock.js
          node --test script/tests/test_response_controls.cjs
          python3 script/tests/test_response_contract.py
          node --test script/tests/test_discussion_layout.cjs
          xcodegen generate
      - name: Test on iPhone
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          test_args=(-project Margined.xcodeproj -scheme MarginediOS
            -destination "platform=iOS Simulator,id=$device_id"
            -derivedDataPath "$RUNNER_TEMP/Margined-ios" CODE_SIGNING_ALLOWED=NO
            -parallel-testing-enabled NO)
          xcodebuild "${test_args[@]}" build-for-testing > "$RUNNER_TEMP/ios-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ios-build.log"; exit 1; }
          # Isolate bounded WebKit renderer checks in a fresh host, before
          # UI-fixture process churn. Keep every assertion and deadline.
          rendering_status=0
          xcodebuild "${test_args[@]}" test-without-building \
            -only-testing:MarginediOSTests/RenderingTests \
            -only-testing:MarginediOSTests/DiscussionRenderingTests \
            > "$RUNNER_TEMP/ios-rendering-tests.log" 2>&1 || rendering_status=$?
          if ((rendering_status != 0)); then tail -80 "$RUNNER_TEMP/ios-rendering-tests.log"; else tail -20 "$RUNNER_TEMP/ios-rendering-tests.log"; fi
          # Complement the first batch: every test runs exactly once, with no
          # failure retries and the same compiled app/test products. Run it
          # even if rendering failed, so diagnostics cover the whole suite.
          remaining_status=0
          xcodebuild "${test_args[@]}" test-without-building \
            -skip-testing:MarginediOSTests/RenderingTests \
            -skip-testing:MarginediOSTests/DiscussionRenderingTests \
            > "$RUNNER_TEMP/ios-tests.log" 2>&1 || remaining_status=$?
          if ((remaining_status != 0)); then tail -80 "$RUNNER_TEMP/ios-tests.log"; else tail -20 "$RUNNER_TEMP/ios-tests.log"; fi
          if ((rendering_status != 0 || remaining_status != 0)); then exit 1; fi
      - name: Build for iPad and iPhone devices
        run: |
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Margined-device" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-device.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ios-device.log"; exit 1; }
      - name: Preserve validation details including all test attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-validation-details
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-rendering-tests.log
            ${{ runner.temp }}/ios-tests.log
            ${{ runner.temp }}/ios-device.log
            ${{ runner.temp }}/Margined-ios/Logs/Test
          retention-days: 7
