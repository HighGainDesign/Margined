name: iOS native coordinate calibration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-native-coordinate-calibration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 script/verify-vendor.py
          xcodegen generate
      - name: Measure public zoom and inset coordinates in two fresh processes
        run: |
          mkdir -p "$RUNNER_TEMP/native-coordinate-calibration"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/native-coordinate-calibration/devices.json"
          device_id=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/native-coordinate-calibration/devices.json")); print(next(x["udid"] for g in d["devices"].values() for x in g if "iPhone" in x["name"]))')
          git rev-parse HEAD > "$RUNNER_TEMP/native-coordinate-calibration/source.txt"
          xcodebuild -version >> "$RUNNER_TEMP/native-coordinate-calibration/source.txt"
          printf '%s\n' "device=$device_id flags=DEBUG MARGINED_NATIVE_COORDINATE_CALIBRATION" >> "$RUNNER_TEMP/native-coordinate-calibration/source.txt"
          shasum -a 256 iOSTests/MobileDiscussionInteractionTests.swift >> "$RUNNER_TEMP/native-coordinate-calibration/source.txt"
          result=0
          xcodebuild -project Margined.xcodeproj -scheme MarginediOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/Margined-native-coordinate-calibration" \
            -resultBundlePath "$RUNNER_TEMP/native-coordinate-calibration/calibration.xcresult" \
            CODE_SIGNING_ALLOWED=NO 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG MARGINED_NATIVE_COORDINATE_CALIBRATION' \
            -only-testing:MarginediOSTests/MobileDiscussionInteractionTests/testNativeCoordinateCalibrationAcrossZoomAndInsets \
            -parallel-testing-enabled NO -test-iterations 2 -test-repetition-relaunch-enabled YES \
            test > "$RUNNER_TEMP/native-coordinate-calibration/calibration.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/native-coordinate-calibration/test-exit.txt"
          tail -30 "$RUNNER_TEMP/native-coordinate-calibration/calibration.log"
          exit "$result"
      - name: Preserve all coordinate measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-native-coordinate-calibration
          path: ${{ runner.temp }}/native-coordinate-calibration
          retention-days: 7
