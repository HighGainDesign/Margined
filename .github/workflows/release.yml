name: Signed macOS release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'HighGainDesign/Margined'
    runs-on: macos-26
    timeout-minutes: 180
    # Configure this environment to allow only protected v* release tags.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version and source
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vX.Y.Z release tag.' >&2; exit 1; }
          version=$(ruby -ryaml -e 'print YAML.safe_load(File.read("project.yml"))["settings"]["base"]["MARKETING_VERSION"]')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag must match MARKETING_VERSION in project.yml.' >&2; exit 1; }
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo 'Release only commits merged into the default branch.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/dmg-env"
          "$RUNNER_TEMP/dmg-env/bin/python" -m pip install -r script/dmg-requirements.txt
          xcodebuild -version

      - name: Run tests before installing credentials
        run: |
          set -euo pipefail
          python3 script/verify-vendor.py
          python3 script/validate-localizations.py
          xcodegen generate
          xcodebuild -project Margined.xcodeproj -scheme Margined -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/Margined-tests" \
            CODE_SIGN_IDENTITY=- test > "$RUNNER_TEMP/tests.log" 2>&1 || {
              grep -n -E 'error:|failed|Failing tests:' "$RUNNER_TEMP/tests.log" || true
              tail -80 "$RUNNER_TEMP/tests.log"
              exit 1
            }

      - name: Prepare brief release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          python3 script/release-notes.py "$RELEASE_VERSION" > dist/release-notes.md

      - name: Check each interface language in a fresh process
        run: |
          xcodebuild -project Margined.xcodeproj -scheme Margined -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/Margined-tests" \
            CODE_SIGN_IDENTITY=- build-for-testing > "$RUNNER_TEMP/locale-build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/locale-build.log"; exit 1; }
          python3 script/test-localizations.py "$RUNNER_TEMP/Margined-tests"

      - name: Preserve test failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-failure-details
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/Margined-tests/Logs/Test
          retention-days: 7

      - name: Install temporary signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "Missing release secret: $name" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/notary-api.p8"
          keychain="$RUNNER_TEMP/margined-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$api_key"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 10800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
          [[ -n "$identity" ]] || { echo 'A Developer ID Application certificate with its private key is required.' >&2; exit 1; }
          xcrun notarytool store-credentials Margined-CI --keychain "$keychain" \
            --key "$api_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f "$certificate" "$api_key"
          echo "MARGINED_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MARGINED_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple app and DMG
        env:
          MARGINED_TEAM_ID: UX8BPNLPX5
          MARGINED_RELEASE_DIR: ${{ runner.temp }}/Margined-release
          MARGINED_DMG_PYTHON: ${{ runner.temp }}/dmg-env/bin/python
          MARGINED_NOTARY_PROFILE: Margined-CI
          MARGINED_NOTARY_TIMEOUT: 60m
        run: ./script/release.sh

      - name: Remove credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/margined-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-api.p8"

      - name: Preserve only completed release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-dmg
          path: |
            dist/Margined-${{ steps.version.outputs.version }}.dmg
            dist/Margined-${{ steps.version.outputs.version }}.dmg.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the signed release files
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: signed-dmg
          path: dist

      - name: Verify checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist; sha256sum -c "Margined-$RELEASE_VERSION.dmg.sha256")
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'This release already exists; refusing to replace published files.' >&2
            exit 1
          fi
          release_flags=()
          if [[ "$RELEASE_VERSION" == 0.* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Margined-$RELEASE_VERSION.dmg" "dist/Margined-$RELEASE_VERSION.dmg.sha256" \
            --verify-tag --title "Margined $RELEASE_VERSION" --notes-file dist/release-notes.md "${release_flags[@]}"
