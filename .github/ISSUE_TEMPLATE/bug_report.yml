name: Bug report
description: Report a reproducible problem in Margined.
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include your macOS and Margined versions.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Document window
        - Finder Quick Look
        - Drafts action
        - Setup or Settings
        - Installation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior
      description: Explain what you did, what happened, and what you expected.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample
      description: Include a small Markdown example or screenshot with private content removed.
