name: Margined
options:
  bundleIdPrefix: design.highgain
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: UX8BPNLPX5
    MARKETING_VERSION: '1.7.0'
    CURRENT_PROJECT_VERSION: 43
    ENABLE_DEBUG_DYLIB: NO
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Apex:
    path: Vendor/Apex
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9
targets:
  Margined:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Resources]
      - path: App/Resources
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: Integrations/Drafts/Preview in Margined.draftsAction
        buildPhase: resources
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Margined
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Copyright © 2026 HighGainDesign
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: text/markdown
        CFBundleURLTypes:
          - CFBundleURLName: Markdown preview
            CFBundleURLSchemes: [margined]
    entitlements:
      path: App/Margined.entitlements
      properties:
        com.apple.security.application-groups: [UX8BPNLPX5.design.highgain.margined]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.margined
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Apex
        product: ApexC
      - package: SwiftSoup
      - target: MarginedQuickLook
        embed: true
  MarginedQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook
      - path: LICENSE
        buildPhase: resources
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Margined Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: true
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [UX8BPNLPX5.design.highgain.margined]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.margined.quicklook
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Apex
        product: ApexC
      - package: SwiftSoup
  MarginedTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Margined
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.margined.tests
        GENERATE_INFOPLIST_FILE: YES
  MarginediOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: [Resources]
      - path: iOS/Resources
        buildPhase: resources
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
      - path: App/Resources
        buildPhase: resources
      - path: App/AppIcon.icon
        buildPhase: resources
      - path: App/Services/ImageSchemeHandler.swift
      - path: App/Services/SpeechSession.swift
      - path: App/Services/SpeechDriver.swift
      - path: App/Services/SpeechPreferences.swift
      - path: LICENSE
        buildPhase: resources
      - path: Fixtures/Rendering.md
        buildPhase: resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Margined
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Copyright © 2026 HighGainDesign
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: text/markdown
        CFBundleURLTypes:
          - CFBundleURLName: Markdown preview
            CFBundleURLSchemes: [margined]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.margined
        PRODUCT_MODULE_NAME: MarginediOS
        MARKETING_VERSION: '2.0.0'
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(MARGINED_IOS_PROFILE)
    dependencies:
      - package: Apex
        product: ApexC
      - package: SwiftSoup
  MarginediOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOSTests]
    dependencies:
      - target: MarginediOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.margined.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Margined:
    build:
      targets:
        Margined: all
    test:
      targets: [MarginedTests]
      environmentVariables:
        MARGINED_TEST_PREFERENCES: '1'
  MarginediOS:
    build:
      targets:
        MarginediOS: all
    test:
      targets: [MarginediOSTests]
      environmentVariables:
        MARGINED_TEST_PREFERENCES: '1'
